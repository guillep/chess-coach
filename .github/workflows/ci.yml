name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the tests
        run: |
          mkdir test-image
          cd test-image
          curl -fsSL https://get.pharo.org/130+vm | bash
          VM=pharo-vm/Pharo.app/Contents/MacOS/Pharo
          "$VM" --headless Pharo.image metacello install \
            "tonel://$GITHUB_WORKSPACE/src" BaselineOfChessCoach
          "$VM" --headless Pharo.image test --fail-on-failure "ChessCoach-Tests"

      - name: Build the app
        run: packaging/build-app.sh "$GITHUB_SHA"

      - name: Archive the app
        run: ditto -c -k --keepParent "packaging/build/Chess Coach.app" ChessCoach.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChessCoach
          path: ChessCoach.zip
