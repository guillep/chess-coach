name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PharoApplicationGenerator's launcher compiles against SDL2's headers
      - name: Install SDL2
        run: brew install sdl2

      # The tests run on the image that gets packaged, so no zip comes out of a failing build
      - name: Test and build the app
        env:
          RUN_TESTS: 1
        run: packaging/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chessmate-macOS
          path: packaging/Chessmate-macOS.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          packages: cmake mingw64-x86_64-clang zip unzip wget curl make git libtool libSDL2-devel

      - name: Build the app
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        env:
          CHERE_INVOKING: 1
        run: |
          git config --global --add safe.directory "$(pwd)"
          packaging/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chessmate-Windows
          path: packaging/Chessmate-Windows.zip
          if-no-files-found: error

  release:
    # Only when both builds and the tests (in the macOS job) passed; one job, so one release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach the apps to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Chessmate $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Chessmate-macOS.zip Chessmate-Windows.zip --clobber
