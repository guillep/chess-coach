name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the app
        run: packaging/build-app.sh "$GITHUB_SHA"

      - name: Run the tests on the built image
        working-directory: packaging/build/work
        run: pharo-vm/Pharo.app/Contents/MacOS/Pharo --headless Pharo.image test --fail-on-failure "ChessCoach-Tests"

      - name: Archive the app
        run: ditto -c -k --keepParent "packaging/build/Chessmate.app" Chessmate.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Chessmate
          path: Chessmate.zip

      - name: Attach the app to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Chessmate $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Chessmate.zip --clobber
